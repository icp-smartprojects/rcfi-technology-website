name: Website CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci
      - run: npm run build
        env:
          SUPPORT_API_URL: http://localhost:7000
          NEXT_PUBLIC_SUPPORT_PORTAL_URL: http://localhost:9090
